version: "1"
slug: max-subarray-sum
title: 最大子段和
language: zh

target:
  rating: 1200
  tags: ["dp", "kadane", "prefix-sum"]

summary: 给定整数序列，求非空连续子段的最大元素和。
story: >
  小明在记录一只股票连续 n 个交易日的涨跌值。
  他想知道：如果只在一段连续的交易日里持有这只股票，最多能获得多少总收益（也可能亏损）。

task: |
  给定一个长度为 n 的整数序列 a_1, a_2, \dots, a_n。
  求一个非空连续子段 a_l, a_{l+1}, \dots, a_r（1 \le l \le r \le n），
  使得其元素之和最大，输出这个最大的和。

input_format: |
  第一行一个整数 n。
  第二行 n 个整数 a_1, a_2, \dots, a_n，以空格分隔。

output_format: |
  输出一行一个整数，表示最大子段和。

constraints:
  items:
    - name: n
      description: 1 \le n \le 2 \times 10^5
    - name: a_i
      description: -10^9 \le a_i \le 10^9
  bounds:
    n: [1, 200000]
    value: [-1000000000, 1000000000]

samples:
  - input: |
      9
      -2 1 -3 4 -1 2 1 -5 4
    expected_output: "6"
    note: 子段 [4, -1, 2, 1] 的和最大，为 6。
  - input: |
      3
      -1 -2 -3
    expected_output: "-1"
    note: 全为负数时，取单个元素 -1。
  - input: |
      1
      1000000000
    expected_output: "1000000000"
    note: 注意答案可能超出 int 范围。

limits:
  time_ms: 2000
  memory_mb: 256

intended_solution:
  observations:
    - 设 cur_i 为以 i 结尾的最大子段和，则 cur_i = max(a_i, cur_{i-1} + a_i)。
    - 答案等于所有 cur_i 的最大值（Kadane 算法）。
  algorithm:
    - 顺序扫描序列，维护 cur（以当前元素结尾的最大子段和）与 best（全局答案）。
    - 对每个 x：cur = max(x, cur + x)，然后 best = max(best, cur)。
    - 全部为 long long，避免溢出。
  proof_outline:
    - 归纳证明 cur_i 恰为以 i 结尾的最大子段和：要么单独成段（= a_i），要么接在前一段之后（= cur_{i-1} + a_i）。
    - 最优子段必以某个 i 结尾，因此取所有 cur_i 的最大值即为答案。
  complexity:
    time: O(n)
    memory: O(1)

assets:
  std: assets/std.cpp
  brute: assets/brute.cpp
  gen: assets/gen.py
  mutants:
    - path: assets/mutants/wrong_tle_quadratic.cpp
      category: TLE
      description: 思路正确但复杂度为 O(n^2)，在 n=2e5 时必然超时
      expected_verdict: TLE
    - path: assets/mutants/wrong_greedy_reset.cpp
      category: WRONG_GREEDY
      description: 遇到负数就把当前和清零，丢掉了"负数搭桥"的正确情形（如 3,-1,2 应为 4）
      expected_verdict: WA
    - path: assets/mutants/wrong_empty_allowed.cpp
      category: BOUNDARY
      description: 把答案初始化为 0，隐含允许空子段，全负数组会错误输出 0
      expected_verdict: WA

notes: 注意答案上界约为 2 \times 10^{14}，必须使用 64 位整数。
