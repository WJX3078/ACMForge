version: "1"
slug: survivor-sum
title: 逆序求和（survivor 测试）
language: zh

target:
  rating: 800
  tags: ["implementation"]

summary: 输出 n 个整数的和（用于 survivor 闭环测试）。

task: |
  给定 n 个整数 a_1, \dots, a_n，输出它们的和。

input_format: |
  第一行一个整数 n。
  第二行 n 个整数 a_1, \dots, a_n。

output_format: |
  输出一行一个整数。

constraints:
  items:
    - name: n
      description: 1 \le n \le 100
    - name: a_i
      description: -1000 \le a_i \le 1000
  bounds:
    n: [1, 100]
    value: [-1000, 1000]

samples:
  - input: |
      3
      1 2 3
    expected_output: "6"

limits:
  time_ms: 1000
  memory_mb: 256

intended_solution:
  observations:
    - 简单求和。
  algorithm:
    - 顺序累加。
  proof_outline:
    - 定义即答案。
  complexity:
    time: O(n)
    memory: O(1)

assets: {}
