version: "1"
slug: bfs-shortest-path
title: 无权图最短路
language: zh

target:
  rating: 1300
  tags: ["graph", "bfs"]

summary: 无向无权图中求 1 到 n 的最短距离。

task: |
  给定一个 n 个点 m 条边的无向无权图（点编号 1..n，可能不连通、可能有重边或自环）。
  求从点 1 到点 n 的最短边数；若不可达，输出 -1。

input_format: |
  第一行两个整数 n, m。
  接下来 m 行，每行两个整数 u, v（1 \le u, v \le n），表示一条无向边。

output_format: |
  输出一行一个整数：1 到 n 的最短边数；不可达输出 -1。

constraints:
  items:
    - name: n
      description: 1 \le n \le 10^5
    - name: m
      description: 0 \le m \le 2 \times 10^5
    - name: u, v
      description: 1 \le u, v \le n
  bounds:
    n: [1, 100000]
    m: [0, 200000]
    value: [1, 100000]

samples:
  - input: |
      4 4
      1 2
      2 3
      3 4
      1 4
    expected_output: "1"
  - input: |
      3 1
      1 2
    expected_output: "-1"
  - input: |
      1 0
    expected_output: "0"
    note: 起点即终点，距离 0。

limits:
  time_ms: 2000
  memory_mb: 256

intended_solution:
  observations:
    - 无权图最短路 = BFS 层序扩展。
  algorithm:
    - 从 1 开始 BFS，dist[1] = 0，沿无向边扩展并标记访问，dist[n] 即答案（未访问则 -1）。
  proof_outline:
    - BFS 按层扩展保证第一次到达某点时距离最小（无权图标准结论）。
  complexity:
    time: O(n + m)
    memory: O(n + m)

assets: {}
