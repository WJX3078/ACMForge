version: "1"
slug: sliding-window-min
title: 滑动窗口最小值
language: zh

target:
  rating: 1400
  tags: ["data-structure", "monotonic-deque"]

summary: 长度为 k 的滑动窗口从左到右扫过数组，输出每个位置窗口内的最小值。

task: |
  给定长度为 n 的整数数组 a_1, \dots, a_n 和窗口长度 k。
  窗口从数组最左端开始，每次向右移动一格，共 n - k + 1 个位置。
  对每个窗口位置输出窗口内元素的最小值。

input_format: |
  第一行两个整数 n, k。
  第二行 n 个整数 a_1, \dots, a_n。

output_format: |
  输出一行 n - k + 1 个整数，依次为每个窗口的最小值，以空格分隔。

constraints:
  items:
    - name: n
      description: 1 \le n \le 2 \times 10^5
    - name: k
      description: 1 \le k \le n
    - name: a_i
      description: -10^9 \le a_i \le 10^9
  bounds:
    n: [1, 200000]
    value: [-1000000000, 1000000000]

samples:
  - input: |
      5 2
      3 1 4 1 5
    expected_output: "1 1 1 1"
  - input: |
      1 1
      -7
    expected_output: "-7"
  - input: |
      4 4
      9 2 7 4
    expected_output: "2"

limits:
  time_ms: 2000
  memory_mb: 256

intended_solution:
  observations:
    - 单调队列：队内下标对应的值严格递增；队头即当前窗口最小值。
  algorithm:
    - 从左到右扫描：入队前弹出队尾所有值 >= a_i 的下标；队头超出窗口则弹出队头；
      当 i \ge k 时输出队头对应的值。
  proof_outline:
    - 队内值递增且下标递增，被弹出的队尾元素不可能再成为任何后续窗口的最小值。
  complexity:
    time: O(n)
    memory: O(n)

assets: {}
