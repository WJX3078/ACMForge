version: "1"
slug: max-subarray-sum
title: 最大子段和
language: zh

target:
  rating: 1200
  tags: ["dp", "kadane"]

summary: 给定整数序列，求非空连续子段的最大元素和。

task: |
  给定一个长度为 n 的整数序列 a_1, a_2, \dots, a_n。
  求一个非空连续子段 a_l, \dots, a_r（1 \le l \le r \le n），
  使其元素之和最大，输出这个最大的和。

input_format: |
  第一行一个整数 n。
  第二行 n 个整数 a_1, \dots, a_n，以空格分隔。

output_format: |
  输出一行一个整数，表示最大子段和。

constraints:
  items:
    - name: n
      description: 1 \le n \le 2 \times 10^5
    - name: a_i
      description: -10^9 \le a_i \le 10^9
  bounds:
    n: [1, 200000]
    value: [-1000000000, 1000000000]

samples:
  - input: |
      9
      -2 1 -3 4 -1 2 1 -5 4
    expected_output: "6"
  - input: |
      3
      -1 -2 -3
    expected_output: "-1"
  - input: |
      1
      1000000000
    expected_output: "1000000000"

limits:
  time_ms: 2000
  memory_mb: 256

intended_solution:
  observations:
    - 设 cur_i 为以 i 结尾的最大子段和，则 cur_i = max(a_i, cur_{i-1} + a_i)。
    - 答案为所有 cur_i 的最大值（Kadane 算法）。
  algorithm:
    - 顺序扫描，维护 cur 与 best：cur = max(x, cur + x)，best = max(best, cur)。
    - 全程使用 long long 防溢出。
  proof_outline:
    - 归纳证明 cur_i 是以 i 结尾的最大子段和；最优子段必以某个 i 结尾。
  complexity:
    time: O(n)
    memory: O(1)

assets: {}

notes: 答案上界约 2 \times 10^{14}，必须使用 64 位整数。
